<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User - Bug Tracking System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Add New User</h1>

    <form th:action="@{/users/save}"
          th:object="${user}"
          method="post">

        <label for="name">Name:</label>
        <input type="text"
               id="name"
               th:field="*{name}"
               required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email"
               id="email"
               th:field="*{email}"
               required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password"
               id="password"
               th:field="*{password}"
               minlength="8"
               required>
        <br><br>

        <button type="submit">Save User</button>
    </form>

    <br>
    <a th:href="@{/users}">Back to Users</a>

</body>
</html>
