<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comments - Bug Tracking System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Bug Comments</h1>

    <a th:href="@{/comments/add}">Add New Comment</a>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Comment</th>
                <th>Bug</th>
                <th>Author</th>
                <th>Created At</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="comment : ${comments}">
                <td th:text="${comment.id}"></td>
                <td th:text="${comment.content}"></td>

                <td th:text="${comment.bug != null
                    ? comment.bug.title : 'Not Assigned'}"></td>

                <td th:text="${comment.author != null
                    ? comment.author.name : 'Not Assigned'}"></td>

                <td th:text="${comment.createdAt}"></td>

                <td>
                    <form th:action="@{/comments/delete/{id}(id=${comment.id})}"
                          method="post">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <br>

    <a th:href="@{/users}">Users</a> |
    <a th:href="@{/projects}">Projects</a> |
    <a th:href="@{/bugs}">Bugs</a>

</body>
</html>
