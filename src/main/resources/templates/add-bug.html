<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Bug - Bug Tracking System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Report New Bug</h1>

    <form th:action="@{/bugs/save}"
          th:object="${bug}"
          method="post">

        <label for="title">Bug Title:</label>
        <input type="text" id="title" th:field="*{title}" required>
        <br><br>

        <label for="description">Description:</label>
        <textarea id="description"
                  th:field="*{description}"
                  rows="5"
                  cols="40"
                  required></textarea>
        <br><br>

        <label for="status">Status:</label>
        <select id="status" th:field="*{status}" required>
            <option value="OPEN">OPEN</option>
            <option value="IN_PROGRESS">IN_PROGRESS</option>
            <option value="RESOLVED">RESOLVED</option>
            <option value="CLOSED">CLOSED</option>
        </select>
        <br><br>

        <label for="priority">Priority:</label>
        <select id="priority" th:field="*{priority}" required>
            <option value="LOW">LOW</option>
            <option value="MEDIUM">MEDIUM</option>
            <option value="HIGH">HIGH</option>
            <option value="CRITICAL">CRITICAL</option>
        </select>
        <br><br>

        <label for="projectId">Project:</label>
        <select id="projectId" name="projectId" required>
            <option value="">Select Project</option>
            <option th:each="project : ${projects}"
                    th:value="${project.id}"
                    th:text="${project.name}">
            </option>
        </select>
        <br><br>

        <label for="assignedUserId">Assign Developer:</label>
        <select id="assignedUserId" name="assignedUserId">
            <option value="">Unassigned</option>
            <option th:each="user : ${users}"
                    th:value="${user.id}"
                    th:text="${user.name}">
            </option>
        </select>
        <br><br>

        <button type="submit">Save Bug</button>
    </form>

    <br>
    <a th:href="@{/bugs}">Back to Bugs</a>

</body>
</html>
