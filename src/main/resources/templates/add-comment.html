<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Comment - Bug Tracking System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Add New Comment</h1>

    <form th:action="@{/comments/save}"
          th:object="${comment}"
          method="post">

        <label for="content">Comment:</label>
        <textarea id="content"
                  th:field="*{content}"
                  rows="5"
                  cols="40"
                  required></textarea>
        <br><br>

        <label for="bugId">Select Bug:</label>
        <select id="bugId" name="bugId" required>
            <option value="">Select Bug</option>
            <option th:each="bug : ${bugs}"
                    th:value="${bug.id}"
                    th:text="${bug.title}">
            </option>
        </select>
        <br><br>

        <label for="authorId">Select Author:</label>
        <select id="authorId" name="authorId" required>
            <option value="">Select Author</option>
            <option th:each="user : ${users}"
                    th:value="${user.id}"
                    th:text="${user.name}">
            </option>
        </select>
        <br><br>

        <button type="submit">Save Comment</button>
    </form>

    <br>
    <a th:href="@{/comments}">Back to Comments</a>

</body>
</html>
