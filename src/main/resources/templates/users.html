<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Bug Tracking System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Users</h1>

    <a th:href="@{/users/add}">Add New User</a>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.name}"></td>
                <td th:text="${user.gmail}"></td>
                <td th:text="${user.role}"></td>

                <td>
                    <form th:action="@{/users/delete/{id}(id=${user.id})}"
                          method="post">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <br>

    <a th:href="@{/projects}">Projects</a> |
    <a th:href="@{/bugs}">Bugs</a> |
    <a th:href="@{/comments}">Comments</a>

</body>
</html>
