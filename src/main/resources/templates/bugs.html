<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bugs - Bug Tracking System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <h1>Bug Management</h1>

    <a th:href="@{/bugs/add}">Report New Bug</a>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Project</th>
                <th>Assigned Developer</th>
                <th>Created At</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="bug : ${bugs}">
                <td th:text="${bug.id}"></td>
                <td th:text="${bug.title}"></td>
                <td th:text="${bug.description}"></td>
                <td th:text="${bug.status}"></td>
                <td th:text="${bug.priority}"></td>

                <td th:text="${bug.project != null
                    ? bug.project.name : 'Not Assigned'}"></td>

                <td th:text="${bug.assignedUser != null
                    ? bug.assignedUser.name : 'Not Assigned'}"></td>

                <td th:text="${bug.createdAt}"></td>

                <td>
                    <form th:action="@{/bugs/delete/{id}(id=${bug.id})}"
                          method="post">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <br>

    <a th:href="@{/users}">Users</a> |
    <a th:href="@{/projects}">Projects</a> |
    <a th:href="@{/comments}">Comments</a>

</body>
</html>
